title: Energy Readiness
summary: From battery intelligence to operational decisions.
excerpt: "An independent product concept exploring how battery-health signals, telemetry freshness, and human approval can support operational readiness decisions."
order: 2
kind: Technical product management
status: Live prototype
whatItIs: An independent product concept with simulated data. Not affiliated with Safire Technology Group.
builtWith: React, TypeScript, and Vite. Static, with no backend.
links:
  - { label: Launch live demo, url: "https://ayray.github.io/energy-readiness/" }
  - { label: Source on GitHub, url: "https://github.com/ayray/energy-readiness" }
